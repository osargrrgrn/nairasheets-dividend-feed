name: Update NGX dividend feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,10,14,18,22 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Update feed
        run: python -m collector.run

      - name: Commit changed feed
        run: |
          git config user.name "nairasheets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dividends.csv docs/pending_dividends.csv docs/index.html disclosure_archive.json collector_state.json review_queue.json
          git diff --cached --quiet || git commit -m "Update NGX dividend feed"
          git push
