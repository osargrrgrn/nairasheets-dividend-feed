name: Update NGX dividend feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,10,14,18,22 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR system dependencies
        run: sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update feed
        run: python -u -m collector.run

      - name: Run benchmark diagnostic
        run: python -u -m collector.diagnose
        continue-on-error: true

      - name: Commit changed feed
        run: |
          git config user.name "nairasheets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/dividends.csv docs/pending_dividends.csv docs/index.html disclosure_archive.json discovery_debug.json collector_state.json review_queue.json
          git diff --cached --quiet || git commit -m "Update NGX dividend feed"
          git push
